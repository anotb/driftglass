version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      cloudflare-runtime:
        patterns:
          - agents
          - wrangler
      mcp:
        patterns:
          - "@modelcontextprotocol/*"

  - package-ecosystem: npm
    directory: /labs/deep-dive-lab
    schedule:
      interval: weekly
    groups:
      computer-lab:
        patterns:
          - "@cloudflare/*"
          - wrangler

  - package-ecosystem: npm
    directory: /labs/agent-memory-bridge
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
